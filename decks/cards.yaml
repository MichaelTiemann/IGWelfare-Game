        rule: "'The Demographic Vise.' Austerity orthodoxy demands raising the NZ Super age to 67 or 70 (triggering a 38%–45% disability/benefit substitution leak and regressively penalizing Māori, Pasifika, and manual workers while PAYE still climbs to 25.55%–26.85%). Exhaust all Age 65+ cards; 0 Lifetime Experience Tokens can be shared."
      - label: "Counter-Play Effect — Pass the Torch, Not the Speculative Bubble"
        rule: "Rotate dormant property hoarding from the NZD 1.6T transfer into the Age-20 Youth Capital Grant (B:03) while keeping Universal NZ Super at Age 65 (B:06, bending required PAYE down to 24.45%—outperforming Age 70!). Unlock both financial capital and 60 years of accumulated human wisdom (K:06)."
    flavor_text: "A society that impoverishes its elders or exiles its youth breaks the chain of memory. A society that honors both turns a lifetime of learning into the next generation's launchpad."
    empirical_anchor: "Document 1A Part IV Section 5 (Why keeping NZ Super at 65 beats raising the pension age to 67 or 70)."

