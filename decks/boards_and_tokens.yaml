# ------------------------------------------------------------------------------
# 1. FIVE DOUBLE-SIDED TOKEN TYPES (SS0 LIABILITY -> SS2 ENDOWMENT)
# ------------------------------------------------------------------------------
tokens:
  - id: "TOK:01"
    name: "Cohort Meeples (Tamariki → Rangatahi → Kaumātua)"
    quantity_per_table: 20
    shape: "Meeple / Rounded Disc (22mm)"
    side_a_ss0:
      label: "Stunted / Hardship Corner (i_c = 0)"
      color: "#dc2626"
      icon: "🔴"
      mechanic: "Enters on d20 roll 1–4 (22.0% Dunedin share) without B:01. Inflicts NZD 105k–180k/yr hull drag across Exits 1, 2, 4."
    side_b_ss2:
      label: "Thriving Launch & Readiness (h6–h7)"
      color: "#16a34a"
      icon: "🟢"
      mechanic: "Flipped by B:01 (Te Korowai Mokopuna) + B:02 (Tuakana–Teina). Generates +NZD 16.1k/yr net adult fiscal surplus."

  - id: "TOK:02"
    name: "Financial & Physical Capital Discs (z_l / a_prec → z_h / pv=5)"
    quantity_per_table: 24
    shape: "Hex / Coin Disc (22mm)"
    side_a_ss0:
      label: "Dormant Dirt & Precautionary Hoard (z_l / a_prec)"
      color: "#64748b"
      icon: "🪨"
      mechanic: "Locked in NZD 1.6T untaxed property pool or hoarded against z2 fuel shocks. Inflates metro rents 3.1x and triggers T:04."
    side_b_ss2:
      label: "Active Builder & Solar Endowment (z_h / pv=5)"
      color: "#d97706"
      icon: "⚡"
      mechanic: "Flipped by B:05 (Use-It-Or-Lose-It) or E:02 (Energy as Endowment). Funds firms, B:03 Youth Grants, and 1.7x grids (C:04)."

  - id: "TOK:03"
    name: "Obligation & Ledger Cubes (To Whom & How Much)"
    quantity_per_table: 20
    shape: "Square Cube (22mm)"
    side_a_ss0:
      label: "Unfunded Liability & Hull Drag"
      color: "#1e293b"
      icon: "🩸"
      mechanic: "Owed to Future Mokopuna (200% Crown Debt path), Banks (+60 bps spread), Foreign Oil Cartels (NZD 20B/yr), & Reactive Care."
    side_b_ss2:
      label: "Actuarial Asset & 50/50 Sinking Cube"
      color: "#0284c7"
      icon: "🛡️"
      mechanic: "Flipped by B:07 (3.8x Year-5 ACC return) & B:06 (50% Debt Sinking -60 bps / 50% Resilient Infrastructure)."

  - id: "TOK:04"
    name: "Mana, Ako, & Social Cohesion Stars"
    quantity_per_table: 16
    shape: "Star Token (22mm)"
    side_a_ss0:
      label: "Mana Eroded / Outrage Drag (T:05)"
      color: "#7c2d12"
      icon: "🌪️"
      mechanic: "Spawned when cohorts are left stunted or exiled (H:03). Drops trust to 40.0% and adds +25.0% Exit 4 justice drag (~NZD 2B/yr)."
    side_b_ss2:
      label: "Mana Created / Whanaungatanga & Care"
      color: "#0d9488"
      icon: "✨"
      mechanic: "Created by B:01 (+NZD 15.3k parental care crowd-in), B:02 (Ako), C:02 (Monilukutaito), & K:07. Drives Cohesion 100.0 → 126.0."

  - id: "TOK:05"
    name: "Ngā Kete o te Wānanga (Knowledge & Legacy Baskets)"
    quantity_per_table: 12
    shape: "Basket / Octagon Token (22mm)"
    side_a_ss0:
      label: "Exiled / Siloed IP (Exit 3 Brain Drain)"
      color: "#475569"
      icon: "📦"
      mechanic: "Lost when 19.3%–23.4% of metro graduates emigrate to Australia (H:03) or elders are trapped in survival mode (H:04)."
    side_b_ss2:
      label: "Open-Source Wisdom & Tech Multiplier (K:06 + N:05)"
      color: "#7c3aed"
      icon: "🧺"
      mechanic: "Generated by dignified Kaumātua (K:06, Age 65+) and retained Founders (B:03). Multiplies next generation human capital by 1.8x!"

# ------------------------------------------------------------------------------
# 2. THE LIFECYCLE RIVER (5 GATES + 4 EXITS ON A3 SHEET 1)
# ------------------------------------------------------------------------------
lifecycle_gates:
  - id: "GATE:01"
    name: "GATE 1 • FIRST 2000 DAYS (0–5)"
    foils_title: "Front Lifting Foil (Stage 1)"
    waka_title: "He Kākano i Rangiātea (Being)"
    key_cards: ["B:00", "B:01", "N:02", "K:01"]
    ss0_outcome: "22.0% Dunedin / 14.3% GUiNZ trapped in Hardship Corner (i_c = 0)."
    ss2_outcome: "NZD 13.0k/yr in-kind wraparound compresses stunting to 1.5% and crowds in +NZD 15.3k private parental care."

  - id: "GATE:02"
    name: "GATE 2 • RANGATAHI NAVIGATION (12–14)"
    foils_title: "Front Foil Strut (Stage 2)"
    waka_title: "Te Pikinga o Tāne & Tuakana–Teina (Becoming)"
    key_cards: ["B:02", "C:02", "C:03", "T:05"]
    ss0_outcome: "Only 17.3% mentored; unbuffered family job shocks and T:05 disinformation erode school engagement."
    ss2_outcome: "65.0%+ mentored via Stars, Project K, Kura-ā-Iwi, & Montessori; immune to job shocks and T:05 outrage drag."

  - id: "GATE:03"
    name: "GATE 3 • YOUNG ADULT LAUNCH (20–35)"
    foils_title: "Wing-Sail Power Plant (Launch)"
    waka_title: "Tūrangawaewae & Ka Hao te Rangatahi"
    key_cards: ["B:03", "B:05", "T:04", "H:03"]
    ss0_outcome: "3.1x metro rent crush; 19.3%–23.4% graduate brain drain to Australia; top talent diverted to rent-seeking (T:04)."
    ss2_outcome: "Universal NZD 62k+ Youth Capital Grant seed; homeownership 28.0% → 41.5%; 3,550/yr graduates retained."

  - id: "GATE:04"
    name: "GATE 4 • MID-CAREER STEWARDSHIP (36–64)"
    foils_title: "Full Foil Flight & Grid Firming"
    waka_title: "Kaitiakitanga & Whānau Flourishing"
    key_cards: ["B:04", "B:05", "E:02", "E:03"]
    ss0_outcome: "High precautionary hoarding against z2 energy shocks; PAYE climbing toward 28.2%; cramped working-age leisure."
    ss2_outcome: "PAYE cut to 18.5% (-3.5 pp); +3.2% to +9.6% real wages; pv=5 Solar Endowment frees leisure and working capital."

  - id: "GATE:05"
    name: "GATE 5 • KAUMĀTUA & CROSSING OVER (65+)"
    foils_title: "Rear T-Foil Stabilizer & Bequest"
    waka_title: "Ngā Kete o te Wānanga &\nHawaiki Anamata"
    key_cards: ["B:06", "K:06", "N:05", "H:04"]
    ss0_outcome: "Orthodoxy demands raising Super age to 67–70 (H:04); wealth locked in passive dirt until accidental death bequests."
    ss2_outcome: "Universal NZ Super kept at 65; elders pass down Ngā Kete wisdom tokens (1.8x multiplier), Solar PV, & Youth Grant seeds."

exits_and_drains:
  - id: "EXIT:01"
    name: "EXIT 1 • STATE CARE & HARM"
    subtitle: "Oranga Tamariki Reactive Pipeline"
    ss0_drain: "5,500 children in care @ NZD 180k/yr + NZD 181k lifetime harm drag"
    ss2_target: "Cut by >94.0% (under 300 entries nationally via B:01 + K:01)"
  - id: "EXIT:02"
    name: "EXIT 2 • AVOIDABLE HOSPITAL NIGHTS"
    subtitle: "Paediatric & Adult Health Drag"
    ss0_drain: "Cold/damp housing & early stress drive 57.0%–81.0% of adult hospital nights"
    ss2_target: "Slashed via B:01 warm wraparound + E:01/E:02 bottom-half whānau solar"
  - id: "EXIT:03"
    name: "EXIT 3 • TRANS-TASMAN BRAIN DRAIN"
    subtitle: "Skilled Graduate Exile (Abroad)"
    ss0_drain: "19.3%–23.4% of metro graduates exiled to Sydney/Melbourne (H:03)"
    ss2_target: "Compressed to 7.6% natural circulation; +3,550/yr builders retained (B:03)"
  - id: "EXIT:04"
    name: "EXIT 4 • JUSTICE & POLARISATION"
    subtitle: "Corrections & T:05 Outrage Drag"
    ss0_drain: "NZD 150k/prisoner-yr + 25.0% T:05 polarisation drag (NZD 17.7B–28.5B/yr Exits 1–4)"
    ss2_target: "Total remediation drag slashed 75.0% down to NZD 4.2B/yr (B:04 + B:07)"

# ------------------------------------------------------------------------------
# 3. THE SEVEN CAPITALS & OBLIGATIONS TRACKS (DASHBOARD ON A3 SHEET 1)
# ------------------------------------------------------------------------------
capital_tracks:
  - id: "CAP:01"
    name: "1. Financial & Actuarial Capital (Crown & Household Ledger)"
    ss0_baseline: "-NZD 17.7B/yr Drag | 200% Debt Path | 22.0% → 28.2% PAYE"
    ss1_milestone: "Year 5 ACC Breakeven: 1.2x Direct (NZD 10.7B) / 3.8x Total (NZD 35.3B)"
    ss2_victory: "<40% Crown Debt | -60 to -100 bps Rates | 18.5% PAYE (-3.5 pp Cut)"
    primary_cards: ["B:05", "B:06", "B:07", "N:03"]

  - id: "CAP:02"
    name: "2. Built Environment & Grid Infrastructure"
    ss0_baseline: "3.1x Metro Rent Crush | Brittle Grid | NZD 6.2B LNG Boondoggle"
    ss1_milestone: "Rents Cooled -7.5% | Schools & Marae Solar Microgrids (NZD 1.2B–1.5B)"
    ss2_victory: "1.7x Coastal & Grid Armor (C:04) | Rents -10.5% | +NZD 15.6B/yr Energy Savings"
    primary_cards: ["C:04", "E:01", "E:02", "E:03"]

  - id: "CAP:03"
    name: "3. Domestic & Whānau Care Capital"
    ss0_baseline: "Stone–Geary Subsistence Corner (i_c = 0) | Crushed Working-Age Leisure"
    ss1_milestone: "+NZD 15.3k/yr Crowded-In Parental Care (NZD 8.7k Cash + 6.5k Time)"
    ss2_victory: "Expanded Lifespan Leisure (leisure_h) + Warm Intergenerational Solar Homes"
    primary_cards: ["B:01", "N:02", "E:02"]

  - id: "CAP:04"
    name: "4. Natural & Ecological Capital (Kaitiakitanga & CO2e)"
    ss0_baseline: "+1°C Bilal–Känzig Shock (USD 1,200/tCO2e) | 20B/yr Imported Fossil Fuels"
    ss1_milestone: "-10.0 MtCO2e/yr (E:01) | No Imported LNG Terminal (-3.2 MtCO2e)"
    ss2_victory: "-14.8 MtCO2e/yr (5-Sector Solar + 19k Farm Ponds) | Resilient Catchments"
    primary_cards: ["C:01", "C:04", "E:01", "E:02", "E:03"]

  - id: "CAP:05"
    name: "5. Social & Epistemic Capital (Trust & Cohesion)"
    ss0_baseline: "Index 100.0 (81/100 CPI Slide; 40.0% Govt Trust; T:05 Outrage Tax)"
    ss1_milestone: "Index 114.8 | Finnish Monilukutaito Inoculation at Gates 1 & 2"
    ss2_victory: "Index 126.0 (#1 Global Trust Rating — Surpassing Finland & Denmark)"
    primary_cards: ["B:02", "C:02", "C:06", "T:05"]

  - id: "CAP:06"
    name: "6. Cultural & Pūrākau Capital (Te Tiriti & Creative IP)"
    ss0_baseline: "Siloed Hulls | Alienated Rangatahi | Cultural Talent Drained Abroad"
    ss1_milestone: "Two Hulls Lashed by Kīato (K:07) | Kura-ā-Iwi & Pasifika Academies"
    ss2_victory: "Aotearoa Creative & Kaikōrero Renaissance (B:03 + K:05 + K:07)"
    primary_cards: ["B:03", "C:03", "K:05", "K:07"]

  - id: "CAP:07"
    name: "7. Technology & Collective Intelligence Capital"
    ss0_baseline: "Lavoisier Syndrome (T:04: Top Minds in z_l Property Speculation)"
    ss1_milestone: "Talent Cutoff Flipped to Builders (z_h) | 8-PType GPU Solver Online (B:08)"
    ss2_victory: "65.0% Thriving Launch | +3.2%–9.6% Real Wages | 1.8x Romer Multiplier (N:05)"
    primary_cards: ["B:05", "B:08", "K:02", "K:04", "N:05", "T:04"]

obligations_matrix:
  - creditor: "1. TO TAMARIKI & MOKOPUNA"
    subtitle: "Future Generations (Ages 0–20)"
    ss0_breach: "22.0% Stunting + 200% Crown Debt + Unbuffered Climate Damage"
    ss2_fulfillment: "1.5% Stunting + NZD 62k Youth Capital Seed + 1.7x Armored Grid"
  - creditor: "2. TO KAUMĀTUA & KUIA"
    subtitle: "Retiring Elders (Ages 65+)"
    ss0_breach: "Threatened Super Age Hike to 67–70 (H:04) + Exiled Grandchildren"
    ss2_fulfillment: "Universal NZ Super Solvent at 65 + Retained Whānau + Honored Wisdom (K:06)"
  - creditor: "3. TO WORKING WHĀNAU"
    subtitle: "All 4 Regions (Rural to Metro)"
    ss0_breach: "3.1x Urban Rents + 2.8x Rural Fuel Penalty + PAYE Climbing to 28.2%"
    ss2_fulfillment: "Rents Cooled -10.5% + Solar EV Relief (C:05) + PAYE Cut to 18.5%"
  - creditor: "4. TO ACTIVE BUILDERS"
    subtitle: "Operating Firms & Bondholders"
    ss0_breach: "High Corporate Tax + Precautionary Hoarding + OCR Volatility"
    ss2_fulfillment: "19/20 Top-5% Builders Win (20:01–20:19) + -60 to -100 bps Lower Rates"
