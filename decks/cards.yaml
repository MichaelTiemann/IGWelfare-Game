    rule: Provide universal fresh, locally grown meals and māra kai (food gardens) across early learning and primary
      schools—boosting children's vegetable intake by +24% to +33% and sending home garden produce with 46% of participating
      whānau.
  - label: Subsistence Relief & Paediatric Health Shield
    rule: Lifts squeezed Rural, Small, and urban low-income whānau off the nutrition subsistence floor, slashes
      avoidable paediatric hospital admissions (Exit 2), and primes local demand for C:09 (1.60x–2.16x Regional
      Food-Hub Procurement).
  flavor_text: A hungry child cannot compound cognitive skill, and a centralized plastic-wrapped ration wastes half
    the rural economy. Feed the tamaiti from the local soil, and both the child and the province thrive.
  empirical_anchor: Ka Ora, Ka Ako Healthy School Lunches evaluations; NC State CEFS Farm-to-ECE empirical audit
    (+24%–33% vegetable intake, 46% take-home produce); Document 3 Section 1.1.
