  vfi_module: ReturnFn_SpatialHH_Compact4D.m & HumanCapital_Lifecycle_aprimeFn.m
  key_equation: Theta_1(theta_c) = [ gamma_{1,self} * theta_c^(phi_1) + gamma_{1,inv} * (i_c + G_{ECE,1}^{eff}
    + g_bar_ECE)^(phi_1) + gamma_{1,par} * h_bar_p^(phi_1) ]^(1/phi_1),  phi_1 = +0.35
  key_equation_latex: \Theta_1(\theta_c) = \left\lbrack \gamma_{1,\mathrm{self}} \theta_c^{\phi_1} + \gamma_{1,\mathrm{inv}}
    \left(i_c + G_{\mathrm{ECE},1}^{\mathrm{eff}} + \bar{g}_{\mathrm{ECE}}\right)^{\phi_1} + \gamma_{1,\mathrm{par}}
    \bar{h}_p^{\phi_1} \right\rbrack^{\frac{1}{\phi_1}}, \quad \phi_1 = +0.35
