- id: B:00
  name: Te Tatau o Rangiātea — The Rawlsian D20 (Veil of Ignorance Die)
  deck: base
  module_level: 1
  mana_tier: 0
  base_mana: 0
  a3_game_sheet: 1
  a3_slot: 1
  type: Rule Zero Artifact — Birth Vigintile, Region, Age & Stochastic Oracle
  lens:
  - Lens 1
  - Lens 2
  - Lens 3
  gate_or_phase: Rule Zero (Pre-Game, Rebirth, & Stochastic Checks)
  cost_or_requirement: Roll a 20-sided die (1 to 20, representing the 20 wealth vigintiles of Aotearoa) plus Region
    and Starting Age at Game Start and at every Age 90 -> Age 0 Rebirth.
  synergy_links:
  - B:01
  - B:08
  - B:12
  - B:15
  - B:16
  effects:
  - label: Who Goes First (The Rawlsian Maximin Rule)
    rule: 'Lowest roll (1–4, the 22% Early Hardship Corner; or 1–6 under H:03 GUiNZ drift) goes first, or youngest
      player in a tie. Optional Wellington House Rule: ''Most ignorant of Rawls goes first''—hand the die to whoever
      still thinks landlord tax breaks are a growth strategy.'
  - label: Status Quo Roll (SS0 — LTFM Sinkhole)
    rule: 'Roll 1–4: Caught in the 22% early hardship corner. Roll 5–18: Squeezed by 3.10x metro rents, graduate
      brain drain, and PAYE climbing toward 28.20%. Roll 19–20: Surrounded by 185% Crown debt and -16.21% CE national
      drift. No matter what you roll, the board loses.'
  - label: IGWelfare Roll (SS1 -> SS2 — Up on Foils)
    rule: 'Roll 1–20: Every single median wealth group across all 20 faces wins (+24.70% CE pre-NDC national welfare
      gain, Universal NZ Super lowered to Age 64 in SS2, and PAYE cut to 18.85%–18.25%). Roll any number; no life
      is impossible.'
  - label: Confirming the Fumble (01:01–01:20) & Confirming the Crit (20:01–20:20)
    rule: On a Nat 1, all 20 Bottom-5% sub-slices are rescued from a 52%–92% risk of reduced adult skills (+23.5%
      to +38.4% CE gain, state care cut 94%, and NZD 62k+ Youth Capital Grant at Age 20). On a Nat 20, Active Enterprise
      Builders (z_h) stay net welfare positive right up to NZD 50M net worth and break even at the NZD 140M NBR
      Rich List median.
  - label: Stochastic Additionality & Political Stability Oracle
    rule: Also resolves off-diagonal 4x4 Coalition Additionality bands ([1–5 Headwind | 6–15 Baseline | 16–20 Tailwind])
      and every-3rd-turn Political Stability checks.
  flavor_text: Orthodox economics asks you to play Russian roulette with a twenty-sided die and calls it 'market
    efficiency.' True systems design rewrites the physics of the board so every roll of a child's life comes up
    a winner.
  empirical_anchor: Rawls (1971); Harsanyi (1955); Document 1A Part IV; Document 3 Exec Overview & Section 3.2;
    decks/nat_1.md & decks/nat_20.md.
