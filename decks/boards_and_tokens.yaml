  author: "Michael Tiemann"
  license: "CC-BY-SA-4.0"
  sheet_size: "A3 Landscape (420mm x 297mm)"
  companion_deck: "80 Canonical Cards + 20-Card Lifecycle Tranche Booster (100-Card Play Shoe)"
