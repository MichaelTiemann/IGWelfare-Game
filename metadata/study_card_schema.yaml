$schema: https://json-schema.org/draft/2020-12/schema
title: Foils & Founders v2026.11 80-Card Fold-Over Study Deck Schema
type: object
required:
- study_cards
properties:
  study_cards:
    type: array
    minItems: 80
    maxItems: 80
    items:
      type: object
      required:
      - id
      - name
      - deck
      - a3_study_sheet
      - a3_study_slot
      - economic_concept
      - vfi_module
      - key_equation
      - key_parameters
      - empirical_evidence
      - tabletop_bridge
      - references
      properties:
        id:
          type: string
          pattern: ^[BTCKNHEP]:[0-9]{2}$
        name:
          type: string
        deck:
          type: string
        a3_study_sheet:
          type: integer
          minimum: 1
          maximum: 16
        a3_study_slot:
          type: integer
          minimum: 1
          maximum: 5
        economic_concept:
          type: string
        vfi_module:
          type: string
        key_equation:
          type: string
        key_parameters:
          type: array
          items:
            type: string
        empirical_evidence:
          type: string
        tabletop_bridge:
          type: string
        references:
          type: array
          items:
            type: string
