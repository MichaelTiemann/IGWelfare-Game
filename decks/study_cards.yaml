- id: B:00
  name: Te Tatau o Rangiātea — The Rawlsian D20 (Veil of Ignorance Die)
  deck: base
  a3_study_sheet: 1
  a3_study_slot: 1
  economic_concept: Ex-Ante Harsanyi–Rawls Veil of Ignorance & Joint Income-Wealth Incidence
  vfi_module: WelfareDecomposition_4Region.m & Plot_WealthBracket_GiveAndGain.m
  key_equation: CE_k(Phi) = ( int V_k(a_1, h_1, z_1, j=1; Phi) d mu_{1,k}(Phi) / int V_k(Phi_0) d mu_{1,k}(Phi_0)
    )^(1 / (phi_nd * (1 - sigma_c))) - 1
  key_equation_latex: \mathrm{CE}_k(\Phi) = \left(\frac{\int V_k(a_1, h_1, z_1, j=1; \Phi)\, d\mu_{1,k}(\Phi)}{\int
    V_k(\Phi_0)\, d\mu_{1,k}(\Phi_0)}\right)^{\frac{1}{\phi_{\mathrm{nd}}(1 - \sigma_c)}} - 1
  key_parameters:
  - N_reg = 4 domestic regions [Rural 16.0%, Small 24.0%, Large 25.9%, Auckland 34.1%] + k=5 Abroad
  - 'State tensor per age j: n_a = [61, 7, 9] x n_z = 7 => 26,901 discrete states'
  - '10 Survey-Anchored Earn+Own Tiers: Tier 1 (NZD 45k + 12k, P12) to Tier 10 (NZD 6.5M + 140M, P99.99)'
  empirical_evidence: Under SS0, Treasury's LTFM trajectory drifts to -16.21% CE (185% debt, 28.2% PAYE), while
    25.79% of births hit the i_c = 0 hardship corner. Under SS2, national ex-ante welfare rises +24.70% CE
    pre-NDC (+21.18% Rural to +27.96% Auckland). Across all 10 Earn+Own survey tiers (Stats NZ HES, Rashbrooke
    2021, IRD HWIRP 2023), 100% of the bottom 90% gain +3.6% to +25.4% CE, active z_h entrepreneurs stay net
    positive at NZD 50M (+1.2% CE), and break even at the NZD 140M NBR Rich List median (-0.1% CE, retaining
    95.3%–98.5% of baseline net worth).
  tabletop_bridge: Rolling the D20 for Vigintile, Region, and Starting Age puts players directly inside the
    newborn measure mu_{1,k}(a_1, h_1, z_1) behind Rawls's Veil—while using the same D20 for Coalition Additionality
    and Political Stability models real-world structural uncertainty.
  references:
  - Rawls (1971)
  - Harsanyi (1955)
  - IRD HWIRP (2023) [Ref 41]
  - Stats NZ HES (2025) [Ref 42]
  - Doc 2B Sec 5.5 & 7.4
