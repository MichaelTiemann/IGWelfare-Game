  K:09:
    name: 'Te Kaumātua & Kuia Navigator: Keepers of Ngā Kete o te Wānanga (Ages 64+ in SS2)'
    type: Wayfinder Lifecycle Identity — Crossing Over & Passing Down the Three Baskets (Lens 3)
  K:10:
    name: 'Te Tiriti & Te Waka Hourua: The Big Table Voyaging Formation'
    type: Legendary Kotahitanga Enchantment — Tangata Whenua & Tangata Tiriti Synergy
    effects:
    - label: Two Hulls, One Waka Hourua (Kotahitanga)
      rule: 'While Te Tiriti & Te Waka Hourua (K:10) is active, Tangata Whenua (Rangatiratanga hull) and Tangata
        Tiriti (Kāwanatanga hull) sail lashed together: every Wayfinder at the table shares its Innate Kaupapa Ability
        with co-stakers, and Big Table Political Drag drops from 3.0 to 2.0 Wealth.'
    - label: Good Ancestors for Our Mokopuna
      rule: 'Restore Aotearoa''s Social Credit & Trust Rating (C:02) to 126.0 (#1 in the World), add +4 to Political
        Stability D20 checks against T:07, and unlock B:16 (He Tāngata) and N:09 (The Aotearoa Synthesis).'
    flavor_text: Nā tō rourou, nā taku rourou ka ora ai te iwi — With your food basket and my food basket, the people
      will thrive. When all crews paddle as one Waka Hourua, Aotearoa crosses the deepest sea.
