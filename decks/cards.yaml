    type: "Orthodoxy Hazard -> Nobel Combo Counter-Play (Instant)"
    lens: ["Lens 1", "Lens 3"]
    gate_or_phase: "Turn 1-5 Boss Hazard"
    cost_or_requirement: "Combo Counter Requirement: Tap N:01 (Coase) + N:03 (Williamson) (or B:07 + K:03)."
    synergy_links: ["B:07", "K:03", "N:01", "N:03"]
    effects:
      - label: "The Hazard (Played by the Board)"
        rule: "'The 3-Year Election Cycle.' Treasury's legacy cash-flow model (LTFM) declares that early-childhood investment is an unrecoverable fiscal deficit because cash breakeven takes 18.8 years. Freeze all Gate 1 (B:01) and Gate 2 (B:02) funding and add +NZD 17.7B/yr in reactive remediation hull drag."
      - label: "Counter-Play Effect — Bend the Accounting Daggerboard"
        rule: "Switch the scoreboard from Cash-Flow Accounting to ACC-Style Actuarial Continuation Valuation (B:07). Instantly cancel the freeze and book 3.84x Audited Fiscal Breakeven in Year 5 (NZD 35.25B Fiscal / NZD 85.40B GDP at 2% real)—proving 1.16x breakeven (NZD 10.68B) from direct cost avoidance alone inside one parliamentary term."
    flavor_text: "A displacement hull sees a 5-year expense. An actuarial hydrofoil sees 25 years of avoided prison cells and hospital beds booked on the balance sheet today."
    empirical_anchor: "Document 1A Part V Section 2 (18.8-year cash vs. Year 5 actuarial breakeven)."

  - id: "H:02"
    name: "The 'Wellington Knows Best' Bottleneck vs. The Ostrom–Heckman Community Engine"
    deck: "orthodoxy"
    module_level: 4
    type: "Orthodoxy Hazard -> Nobel Combo Counter-Play (Instant)"
    lens: ["Lens 1"]
    gate_or_phase: "Gate 1 & Gate 2 Boss Hazard"
    cost_or_requirement: "Combo Counter Requirement: Tap N:02 (Heckman) + N:04 (Ostrom) (or K:01 + B:02)."
    synergy_links: ["B:01", "B:02", "C:03", "K:01", "N:02", "N:04"]
    effects:
      - label: "The Hazard (Played by the Board)"
        rule: "'Siloed Bureaucracy & Unbuffered Shock.' A regional unemployment shock hits families with 12-to-14-year-olds, while central agencies spend 30 cents of every dollar on compliance red tape. Unbuffered rangatahi lose their early childhood gains, and unrestricted cash transfers get swallowed by metropolitan rent."
      - label: "Counter-Play Effect — Trust the Commons, Lock in the Skill"
        rule: "Bypass central micromanagement by routing in-kind resources directly through Iwi Trusts (K:01), Whānau Ora, Barnardos' Te Korowai Mokopuna (B:01), and Montessori / Tuakana–Teina & Graeme Dingle Foundation (B:02, C:03) mentoring. Scale mentoring from 17.3% to 65.0%+, insulate the cohort against unemployment shocks, and compress adult stunting from 22.0% to 1.5%."
    flavor_text: "Central bureaucracy writes concrete rules for yesterday's crisis. Polycentric communities adapt in real time and turn every older student into a leader."
    empirical_anchor: "Document 1A Part II Lens 1; Ferriere et al. (2025) non-homothetic in-kind public provision."

  - id: "H:03"
    name: "The Trans-Tasman Brain-Drain Vortex vs. The Romer–Coase Talent Magnet"
    deck: "orthodoxy"
    module_level: 4
    type: "Orthodoxy Hazard -> Nobel Combo Counter-Play (Instant)"
    lens: ["Lens 2", "Lens 3"]
    gate_or_phase: "Gate 3 (Ages 20-35) Boss Hazard"
    cost_or_requirement: "Combo Counter Requirement: Tap N:01 (Coase) + N:05 (Romer) + B:05 (Use-It-Or-Lose-It Rebalancer)."
    synergy_links: ["B:03", "B:05", "K:02", "N:01", "N:05"]
    effects:
      - label: "The Hazard (Played by the Board)"
        rule: "'The Stepping-Stone Funnel to Sydney.' Speculative land hoarding inflates Auckland housing to 3.10x rural levels while local firms starve for expansion capital. 19.3% to 23.4% of freshly educated 20-to-35-year-old graduates in Auckland and Large regional cities emigrate to Australia."
      - label: "Counter-Play Effect — Unchain Capital & Seed the Youth"
        rule: "Shift taxes off productive enterprise onto dormant land wealth (1.5%) and the NZD 1.6T estate transfer (25%) to fund a universal Age-20 Youth Capital Grant (B:03). Cool metro housing (-7.5% to -10.5%), lift real regional wages by up to +9.6%, lift young-adult homeownership from 28.0% to 41.5%, and retain 3,550/yr skilled graduates in Aotearoa."
    flavor_text: "Why export the most expensive education in the Southern Hemisphere for free when you can give young Kiwis a stake in the country they grew up in?"
    empirical_anchor: "Document 1A Part II Lens 2 & Part IV Section 4; Ireland 1967-2002 brain-drain reversal."

  - id: "H:04"
    name: "The 'Actuarial Burden' Trap ('Raise the Pension Age to 70!') vs. The Living Bequest"
