  - id: "E:01"
    name: "Swapping Fuels for Finance (The First-Order Electrification Card)"
    deck: "electrification"
    module_level: 5
    type: "Player-Drafted Artifact — First-Order Energy Transition (Easy Mode)"
    lens: ["Lens 1", "Lens 2", "Lens 3"]
    gate_or_phase: "Track 1 Tutorial (First-Order Budget Pie)"
    cost_or_requirement: "Cancel the NZD 6.2B Imported LNG Terminal + Sequence via End-of-Life Appliance Replacement (Option B) or C:04 Infra Pool for P01–P50 (Option D)."
    synergy_links: ["B:01", "B:06", "B:07", "C:04", "C:05"]
    effects:
      - label: "The Crowd-Out Constraint (Why Option A Fails)"
        rule: "If you fund a 100% upfront sprint by raiding B:01 (First 2000 Days) or B:02 (Tuakana–Teina Mentoring) in Phase 1 (SS1), take +NZD 105,000/yr per stunted child in reactive remediation hull drag."
      - label: "Targeting Rule (Option D Beats Option C)"
        rule: "Never spend Crown tax breaks subsidizing top-half homeowners (P50–P100) who already earn 15%–17% IRR on solar (Option C—triggers a regressive Grid Death Spiral for renters). Instead, route C:04 infrastructure capital into Bottom-Half Whānau, Social Housing, Schools, and Marae (Option D)—slashing Exit 2 (Paediatric Respiratory Hospitalisations) and accelerating B:07 (Year 5 ACC Breakeven)."
      - label: "First-Order Payoff"
        rule: "Gain +NZD 10.7B to +NZD 15.55B/yr in direct fuel and maintenance savings across Aotearoa and cut 10M tonnes/yr of emissions."
    flavor_text: "In first-order economics, every dollar spent on a solar panel looks like a dollar stolen from a kindergartner. To get both at once without waiting twenty years, you have to look at the second-order math..."
    empirical_anchor: "Griffith, Ellison, Pawson, & Conway (Aug 2024, Investing in Tomorrow: Rewiring Aotearoa); IG Welfare Game Changer Tutorial Part 1."

  - id: "E:02"
    name: "Energy as Endowment (The QEA-2026 Stationary Distribution Shift)"
    deck: "electrification"
    module_level: 5
    type: "Open-Source Engine — Second-Order Lifecycle Transformation (Challenge Mode)"
    lens: ["Lens 1", "Lens 2", "Lens 3"]
