    discounting (omega_i < 1), universal G_{ECE,1} yields +2.46% CE standalone and compresses struggling launch
    from 22.0% to 1.5% when coupled.
  tabletop_bridge: 'Advancing +3 years/turn mirrors j_p in {3, 4} at dt = 3: once a child ages past 5 without
    B:01, Stage 1 closes forever and Stage 2 switches to a rigid harmonic bottleneck (phi_2 = -0.95) where
    late cash remediation loses >70% of ROI.'
  references:
