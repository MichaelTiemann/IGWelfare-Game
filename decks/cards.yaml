        rule: "Converting energy from an unbounded AR(1) fossil-fuel shock (z2) into a Solar + Battery Endowment (pv) eliminates the need for Excess Precautionary Savings. Release NZD 60.8B–91.5B in hoarded precautionary buffers (Delta A_prec)—100% self-financing the NZD 60.2B–75.5B 5-sector national CapEx with zero crowd-out of B:01 or B:02!"
