      in their region, roll B:00: on 1–4 (22%; or 1–6 under H:03), attach a Struggling Trajectory token (permanently
      capping adult earnings and driving 57%–81% of late-game Hospital, Care, and Justice hull drag).'
  - label: Becoming (Dynamic Complementarity & Parental Crowd-In)
    rule: If supported by Te Korowai Mokopuna / Whānau Ora before Age 6, bypass the cash subsistence corner (i_c
      = 0), compress the struggling launch share toward 1.5%, place a Readiness Counter (N:03) granting +2 Productivity
      on subsequent mentoring/schooling cards, and crowd in +NZD 15.3k/yr of private parental care and time for
      free.
