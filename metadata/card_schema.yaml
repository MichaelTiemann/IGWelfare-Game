$schema: https://json-schema.org/draft/2020-12/schema
title: Foils & Founders v2026.11 80-Card Master Deck Schema
type: object
required:
- cards
properties:
  cards:
    type: array
    minItems: 80
    maxItems: 80
    items:
      type: object
      required:
      - id
      - name
      - deck
      - module_level
      - mana_tier
      - base_mana
      - a3_game_sheet
      - a3_slot
      - type
      - lens
      - gate_or_phase
      - cost_or_requirement
      - synergy_links
      - effects
      - flavor_text
      - empirical_anchor
      properties:
        id:
          type: string
          pattern: ^[BTCKNHEP]:[0-9]{2}$
        name:
          type: string
        deck:
          type: string
          enum:
          - base
          - traps
          - resilience
          - kaupapa
          - nobel
          - orthodoxy
          - energy
          - wildcard
        module_level:
          type: integer
          minimum: 1
          maximum: 5
        mana_tier:
          type: integer
          minimum: 0
          maximum: 3
        base_mana:
          type: integer
          minimum: 0
          maximum: 6
        feral_kickback_wealth:
          type: integer
          minimum: 0
          maximum: 5
        a3_game_sheet:
          type: integer
          minimum: 1
          maximum: 8
        a3_slot:
          type: integer
          minimum: 1
          maximum: 10
        type:
          type: string
        lens:
          type: array
          items:
            type: string
        gate_or_phase:
          type: string
        cost_or_requirement:
          type: string
        synergy_links:
          type: array
          items:
            type: string
        co2e_impact:
          type: object
        effects:
          type: array
          items:
            type: object
            required:
            - label
            - rule
            properties:
              label:
                type: string
              rule:
                type: string
        flavor_text:
          type: string
        empirical_anchor:
          type: string
