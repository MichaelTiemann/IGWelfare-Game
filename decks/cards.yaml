        rule: "Because households and firms are no longer over-saving out of fear of commodity fuel shocks, the Reserve Bank of New Zealand no longer has to fight paradoxical demand drag with blunt OCR interest-rate hikes."
      - label: "Triple Macro Payoff"
        rule: "(1) Horsepower-to-Weight Lift: Generate +NZD 15.55B/yr in direct cash savings (4.5–5.2 yr payback) and +3.8% to +5.4% permanently higher GDP. (2) National Security Shield: Cancel the NZD 6.2B imported LNG terminal and insulate food/freight against foreign oil blockades. (3) Combined Rate Cut: Stack with B:06 to lower equilibrium NZ interest rates by 60 to 100 bps."
    flavor_text: "Why spend NZD 6.2 billion on an LNG terminal to import foreign price shocks when you can firm the electricity grid and the macroeconomic grid with the same ray of sunshine?"
    empirical_anchor: "Tiemann (June 2026, Firming the Economic Grid); RBNZ Monetary Policy Statement (Feb 2026); Keen (2022)."
