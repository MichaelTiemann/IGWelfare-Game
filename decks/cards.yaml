metadata:
  game_title: "Beyond the Magic Money Tree — Foils & Founders: The Aotearoa Deck"
  version: "2026.10"
  author: "Michael Tiemann"
  license: "CC-BY-SA-4.0"
  repository: "https://github.com/MichaelTiemann/IGWelfare"
  currency_standard: "Real 2025/2026 NZD (unless USD/GBP explicitly noted)"
  discount_rates:
    treasury_central_real_srtp: 0.02
    treasury_sensitivity_real: 0.08
    attribution_haircut: 0.30
  decks:
    B: "Module 1: Base Game — Getting Aotearoa Up on Foils (B:00 to B:09)"
    T: "Module 1B: Cautionary Trap Cards — Single-Lens Pitfalls (T:00 to T:04)"
    C: "Module 2: Climate & Resilience — Rising Seas & Shifting Winds (C:01 to C:06)"
    K: "Module 3: Wayfinders & Kaupapa — Companion Persona Deck (K:01 to K:07)"
    N: "Module 4: Reaching Abundance & Crossing Infinite Horizons — Nobel Archive (N:01 to N:06)"
    H: "Module 5: The Orthodoxy Boss Deck & Combo Counter-Plays (H:01 to H:05)"
    E: "Module 6: Game-Changer Tutorial — Firming the Economic Grid (E:01 to E:03)"

cards:
  # ----------------------------------------------------------------------------
  # MODULE 1: BASE GAME (B:00 - B:09)
  # ----------------------------------------------------------------------------
  - id: "B:00"
    name: "The Rawlsian D20 (The Veil of Ignorance Die)"
    deck: "base"
    module_level: 1
    type: "Rule Zero Artifact — The 20 Wealth Groups of Aotearoa"
    lens: ["Lens 1", "Lens 2", "Lens 3"]
    gate_or_phase: "Rule Zero (Pre-Game)"
    cost_or_requirement: "Roll a 20-sided die (1 to 20, representing the 20 wealth vigintiles of New Zealand) before Turn 1."
    synergy_links: ["B:01", "B:05", "B:06", "B:09"]
    effects:
      - label: "Who Goes First (The Rawlsian Maximin Rule)"
        rule: "Lowest roll (1-4, the 22% Early Hardship Corner) goes first, or youngest player in a tie. Optional Wellington House Rule: 'Most ignorant of Rawls goes first'—hand the die to whoever is trapped behind the Tinted Limo Window of Ignorance and still thinks landlord tax breaks are a growth strategy."
      - label: "Status Quo Roll (SS0 — Displacement Mode)"
        rule: "Roll 1-4: Caught in the 22% early hardship corner. Roll 5-18: Crushed by 3.10x metro rents, brain drain, and PAYE climbing toward 28.22%. Roll 19-20: Surrounded by 200% Crown debt and departing grandchildren. Result: No matter what you roll, the board loses."
      - label: "IGWelfare Roll (SS1 -> SS2 — Up on Foils)"
        rule: "Roll 1-20: Every single median wealth group across all 20 faces is better off (+20.49% national welfare gain, NZ Super at 65, PAYE cut to 18.5%). Roll any number; you win."
      - label: "Confirming the Fumble (Nat 1 Sub-Roll: 01:01 to 01:20)"
        rule: "In SS0, all 20 sub-slices of the Bottom 5% face 52%-92% stunting risk and cost NZD 44k-180k/yr in reactive care/prisons. In SS2, all 20 faces are rescued (+23.5% to +38.4% CE gain, state care cut 94%, and NZD 62k+ Youth Capital Grant at age 20)."
      - label: "Confirming the Crit (Nat 20 Sub-Roll: 20:01 to 20:20)"
        rule: "Inside the Top 5% (NZD 500k income + 3M NW up to 10M + 250M), faces 20:01-20:13 win on a blended average, and 19 out of 20 faces (20:01-20:19, up to NZD 100M NW) win outright for Active Entrepreneurs (z_h). Even 20:20 retains 89.4%-94.5% of net worth."
    flavor_text: "Orthodox economics asks you to play Russian roulette with a twenty-sided die and calls it 'market efficiency.' True systems design rewrites the physics of the board so every roll of a child's life comes up a winner."
    empirical_anchor: "Rawls (1971); Document 1A Part IV Section 3 & 6B (10-Tier Earn + Own Audit); Stats NZ HES (2024); IRD High-Wealth Project (2023)."

  - id: "B:01"
    name: "Tamariki of the First 2000 Days"
    deck: "base"
    module_level: 1
    type: "Cohort Identity — Gate 1 (Ages 0–5)"
    lens: ["Lens 1"]
    gate_or_phase: "Gate 1 (Ages 0-5)"
    cost_or_requirement: "NZD 13.0k Public Resource / Turn"
    synergy_links: ["B:02", "B:07", "K:01", "N:02"]
    effects:
      - label: "Hardship Corner"
        rule: "If this card enters play without Whānau Wraparound, roll a d20. On a 1–4 (22% chance), attach a Stunted Trajectory token (causes 57%–81% of all late-game Hospital, Justice, and Care damage to your Treasury)."
      - label: "Becoming (Dynamic Complementarity)"
        rule: "If supported by Te Korowai Mokopuna / Whānau Ora, remove all Stunted tokens. This card gains +2 Productivity for every subsequent Schooling card played on it, and Crowds In +NZD 15.3k of Private Parental Care (NZD 8.7k cash + NZD 6.5k time) for free."
    flavor_text: "Identify the corner at age three, or pay NZD 180,000 a year in state care at age fourteen. The math isn't hard; only the politics was."
    empirical_anchor: "Dunedin Multidisciplinary Health & Development Study (22% cohort share); Barnardos Te Korowai Mokopuna (2026); Document 1A Part III."

  - id: "B:02"
    name: "Tuakana–Teina Navigator"
    deck: "base"
    module_level: 1
    type: "Cohort Becoming — Gate 2 Mentor (Ages 12–14)"
    lens: ["Lens 1"]
    gate_or_phase: "Gate 2 (Ages 12-14)"
    cost_or_requirement: "2 Social Cohesion + 1 Creative Agency"
    synergy_links: ["B:01", "B:03", "C:03", "K:05", "N:04"]
    effects:
      - label: "Two-Way Ako (Reciprocal Buff)"
        rule: "Pair this card with any younger Teina card. Both cards gain Indestructible against Family Unemployment & Housing Shocks."
      - label: "Becoming"
        rule: "When this card mentors a peer (via Stars / Project K, Kura Kaupapa, or Montessori Erdkinder), it levels up into a Thriving Launch Adult (+65% cohort rate) and grants the player +1 Executive Function & Mana."
    flavor_text: "In teaching the younger sibling to stand against the storm, the older sibling becomes a mountain."
    empirical_anchor: "Graeme Dingle Foundation Stars / Te Kāhui Whetū & Project K (2025); Berryman & Eley (2019); Lillard (2005); GUiNZ Now We Are 12."

  - id: "B:03"
    name: "Age-20 Renaissance Founder (Kaikōrero & Creator)"
    deck: "base"
    module_level: 1
    type: "Evolved Identity — Gate 3 (Ages 20–35)"
    lens: ["Lens 2"]
    gate_or_phase: "Gate 3 (Ages 20-35)"
    cost_or_requirement: "Evolved from B:02 (Tuakana–Teina Navigator) + Youth Capital Grant"
    synergy_links: ["B:02", "B:05", "K:02", "K:05", "N:05"]
    effects:
      - label: "Brain-Drain Immunity"
        rule: "This card cannot be exiled to the Abroad (Australia/OECD) Zone (cuts city emigration from 19.3%-23.4% down to 7.6% Nat.)."
      - label: "Engine"
        rule: "While metropolitan rents are cooled (-7.5% to -10.5% via B:05), this card generates +9.6% Real Regional Wages, +1 Domestic Cultural IP, and +26 Social Cohesion Index."
    flavor_text: "Give a twenty-year-old a NZD 500-a-week survival flat and you get a barista in Melbourne. Give them a capital runway and you get the next Aotearoa renaissance."
    empirical_anchor: "Document 1A Part II Lens 2 & Part IV Section 4 (3,550/yr retained graduates; NZD 62k seed deposit)."

  - id: "B:04"
    name: "The L-Shaped Hydrofoil (Coupled 4-Region Engine)"
    deck: "base"
    module_level: 1
    type: "Legendary Artifact — System Architecture"
    lens: ["Lens 1", "Lens 2", "Lens 3"]
    gate_or_phase: "SS0 -> SS1 -> SS2"
    cost_or_requirement: "5 Coupled Levers (B:01 + B:02 + B:05 + B:06 + B:07)"
    synergy_links: ["B:01", "B:02", "B:05", "B:06", "B:07"]
    effects:
      - label: "Rulebook Exploit"
        rule: "Conventional Thinkers must keep their keel straight and slog through Displacement Mode. If you control a Front Lifting Foil (Dual-Gate Human Capability, B:01 + B:02), a Wing-Sail Power Plant (Property-to-Enterprise Shift, B:05), and a Rear T-Foil Stabilizer (2050 50/50 Protocol, B:06), lift your economy out of the water."
      - label: "Effect"
        rule: "Slash Fiscal Remediation Drag (Exits 1, 2, 4) by 75% (reducing annual drain from NZD 17.7B–28.5B down to NZD 4.2B). Your Cohort cards now generate +NZD 16.1k/yr Net Surplus instead of a deficit."
    flavor_text: "The rules capped how wide the board could be, but said nothing about whether the board had to be straight. Curve the foil, couple the rudder, and fly."
    empirical_anchor: "Emirates Team New Zealand 2013 America's Cup hydrofoil analogy (Document 1C Section 4); Document 1A Part III Fiscal Sankey."

  - id: "B:05"
    name: "Use-It-Or-Lose-It Rebalancer (The Guvenen Split)"
    deck: "base"
    module_level: 1
    type: "Continuous Enchantment — Lens 3 Power Plant"
    lens: ["Lens 2", "Lens 3"]
    gate_or_phase: "SS1 -> SS2"
    cost_or_requirement: "1.5% Land/Wealth Levy + 25% Peak Estate Levy (stepping down to 18% in SS2)"
    synergy_links: ["B:03", "B:04", "K:02", "N:05", "H:03"]
    effects:
      - label: "Rotate Dormant Dirt"
        rule: "Target opponent's NZD 1.6 Trillion Dormant Property Hoard. Exhaust all Passive Land Speculators (z_l) and cool Auckland housing overvaluation by -7.5% (SS1) to -10.5% (SS2)."
      - label: "Unchain Productive Capital"
        rule: "Convert that dormant value into Productive Enterprise Capital (z_h). All Active Entrepreneurs (all the way up to NZD 100M net worth!) gain +0.2% to +5.8% Welfare, -60 bps cheaper credit, and a +38% larger thriving talent pool."
    flavor_text: "Even the ultra-wealthy keep 89% to 98% of their fortune—a smaller haircut than a routine market crash, except this time their grandkids don't move to Sydney."
    empirical_anchor: "Guvenen et al. (2023) Use-It-Or-Lose-It wealth taxation; Hirano & Toda (2025); Document 1A Part IV Section 3."

  - id: "B:06"
    name: "The 2050 50/50 Stabilizer (SS2 Rocket Ship)"
    deck: "base"
    module_level: 1
    type: "Legendary Engine — Phase 2 Harvest"
    lens: ["Lens 2", "Lens 3"]
    gate_or_phase: "SS2 (Post-Breakeven Harvest)"
    cost_or_requirement: "Cross Year 18.8 Cash Breakeven (or Year 5 Actuarial Breakeven via B:07)"
    synergy_links: ["B:04", "B:07", "C:04", "K:03", "H:05"]
    effects:
      - label: "Left Half (Sovereign Debt Sinking Fund)"
        rule: "Partition all Net Fiscal Surpluses 50/50 at the end of every turn. Left 50% destroys NZD 17.8B–21.9B of Crown Debt per cohort wave and lowers all players' mortgage and business interest rates by 60 bps."
      - label: "Right Half (Public Infrastructure Pool)"
        rule: "Multiply the remaining 50% (NZD 11.5B–14.9B per wave) by 1.65x to build Resilient Grids, Coastal Adaptation, Schools/Marae Solar, and Core Health (C:04)."
      - label: "Ultimate Bonus"
        rule: "Keep Universal NZ Superannuation at Age 65 AND grant all Working-Age Players a -3.5 percentage-point PAYE Tax Cut (22.0% down to 18.5%, returning NZD 3,325/yr to median earners)."
    flavor_text: "Austerity hawks wanted to raise the pension age to 70 and still pay 25.55% in tax. We kept Super at 65 and cut taxes to 18.5%."
    empirical_anchor: "Document 1A Part IV Section 5 & Part V Section 1 (The 2050 50/50 Dynamic Allocation Rule)."

  - id: "B:07"
    name: "ACC Actuarial Time-Bend"
    deck: "base"
    module_level: 1
    type: "Instant — Counter-Spell / Accounting Breakthrough"
    lens: ["Lens 1", "Lens 2", "Lens 3"]
    gate_or_phase: "Year 5 Parliamentary Audit (SS1)"
    cost_or_requirement: "0 Cash (Uses Treasury Circular 2024/15 at 2.0% Real SRTP, net of 30% attribution haircut)"
    synergy_links: ["B:01", "B:02", "B:08", "N:03", "H:01"]
    effects:
      - label: "Counter Austerity"
        rule: "Play when an opponent casts 'Parliamentary 3-Year Deficit Trap' (H:01) or 'There's No Magic Money Tree.' Reveal the 25-Year Forward Liability Ledger. Against NZD 9.19B invested by Year 5, immediately book NZD 10.66B in Direct Cost Avoidance (1.16x outlay) and NZD 35.25B in Total Fiscal Return (3.84x outlay) on the Crown Balance Sheet."
      - label: "Early Credibility Acceleration"
        rule: "Young workers (ages 20-35) see the audited Year 5 surplus and cancel their one-way tickets to Australia 15 years early."
    flavor_text: "When you prevent a car crash, ACC doesn't wait thirty years to book the saved hospital bill. Why were we treating our children worse than a dented bumper?"
    empirical_anchor: "NZ Treasury CBAx User Guidance (Nov 2025) & Circular 2024/15; Barnardos Generational Plan Economic Case (Sept 2026); Document 1A Part V."

  - id: "B:08"
    name: "The 1925 Quantum Leap (OIA 20250878 Override)"
    deck: "base"
    module_level: 1
    type: "Sorcery — Paradigm Shift"
    lens: ["Lens 1", "Lens 2", "Lens 3"]
    gate_or_phase: "System-Wide Architecture"
    cost_or_requirement: "50 Years of Dunedin Study Data + 8-PType GPU Solver"
    synergy_links: ["B:07", "K:03", "K:04", "N:01", "N:03"]
    effects:
      - label: "Expose the Gap"
        rule: "Expose the flaw in the opponent's Long-Term Fiscal Model (LTFM): 'Contains no data at the micro level' (Treasury OIA 20250878)."
      - label: "Unified Board State"
        rule: "Fuse Frontline Social Agencies, ACC Actuaries, and Macro OLG Planners into one unified board state. Unlock NZD 85.40B in Year 5 Booked GDP and NZD 1,510.7B in realized cash GDP over 60 Years."
    flavor_text: "In 1925, physicists overthrew classical mechanics in thirty-six months because the matrix math was already sitting on the shelf. Our math is on the shelf. Stop governing like it's 1924."
    empirical_anchor: "NZ Treasury Official Information Act Response OIA 20250878; Document 1C Section 2 (The 1925 Moment)."

  - id: "B:09"
    name: "Lifting the Gold from the River (He Tāngata)"
    deck: "base"
    module_level: 1
    type: "Mythic Enchantment — Generational Victory"
    lens: ["Lens 1", "Lens 2", "Lens 3"]
    gate_or_phase: "SS2 Victory Condition"
    cost_or_requirement: "Cohort Stunting compressed to 1.5%, Social Cohesion Index at 126.0 (C:06), and all 7 Structural Engines online."
    synergy_links: ["B:00", "B:04", "C:06", "K:07", "N:06"]
    effects:
      - label: "Generational Victory"
        rule: "You win the game with a +20.49% National Welfare Gain (+14.28% Rural, +13.66% Small, +22.17% Large, +26.03% Auckland) and restore New Zealand to #1 on the Global Social Credit Rating."
    flavor_text: "There is no magic money tree—because we are standing in a river of gold. In the nineteenth century we looked for it in the gravel of Otago; in the twentieth we mistook inflated urban dirt for wealth. Today we know the truth: human capability is the only inexhaustible resource on earth. We need only lift it up."
    empirical_anchor: "Document 1A Part IV Section 1 & 6A (7-Factor Attribution); Document 1C Section 3 (A River of Gold)."

  # ----------------------------------------------------------------------------
  # MODULE 1B: CAUTIONARY TRAP CARDS (T:00 - T:04)
  # ----------------------------------------------------------------------------
  - id: "T:00"
    name: "The Molesworth Street Cycle-Lane Paralysis (Limited-Edition Promo Trap)"
    deck: "traps"
    module_level: 1
    type: "Orthodoxy Hazard — Ministerial Limo / Pedestrian Panic"
    lens: ["Lens 2", "Lens 3"]
    gate_or_phase: "SS0 Status Quo"
    cost_or_requirement: "Triggered when leadership peeks through the Tinted Limo Window of Ignorance."
    synergy_links: ["B:00", "B:05", "E:01"]
    effects:
      - label: "The Hazard"
        rule: "A single painted cycle lane appears on Molesworth Street between Premier House and the Beehive. Your leadership is too terrified to cross on foot and summons a Crown limo for a 250-meter trip—burning transport subsidies and giving tax breaks to landlords while reading Ayn Rand in the backseat."
      - label: "The Riddle & Counter-Play"
        rule: "When the Prime Minister finally musters the courage to cross Molesworth Street, which crosses first—the chicken, or THE EGG? Hand the Minister a copy of Foils & Founders and introduce them to HANK to solve the intergenerational chicken-and-egg loop."
    flavor_text: "Afraid to cross Molesworth Street? Here's a card game for you! We can't afford to give every beginner a whole national economy to wreck until they learn the rules—so please, stay on the footpath and play with HANK first."
    empirical_anchor: "HANK and Kindergarten Lecture (Tiemann, 2026)."

  - id: "T:01"
    name: "The Scottish Devolution Ceiling"
    deck: "traps"
    module_level: 1
    type: "Cautionary Trap — Single-Lens Pitch-Pole (Lens 1 Without Lens 3)"
    lens: ["Lens 1", "Lens 2"]
    gate_or_phase: "Round 2 Pitch-Pole Demo"
    cost_or_requirement: "Play B:01 (First 2000 Days) + B:02 (Mentoring) without B:05 (Land/Estate Tax Powers)."
    synergy_links: ["B:01", "B:02", "B:05", "H:05"]
    effects:
      - label: "The Devolution Ceiling"
        rule: "You played First-2000-Days and MCR Pathways Mentoring (cutting child poverty by 6 points below the rest of the UK!), but you forgot to bring sovereign Land & Estate Tax powers. Your middle-earner PAYE tax rate hits 42%–48%, urban rents climb, and child poverty progress stalls out at 21% (missing the 18% target)."
    flavor_text: "Compassion without sovereign capital-tax levers forces working families to pay for everything twice."
    empirical_anchor: "Scottish Government Tackling Child Poverty Delivery Plan 2026-2031; JRF Poverty in Scotland 2026; MCR Pathways (2025); Document 1A Part VI."

  - id: "T:02"
    name: "The 1989 Tokyo Imperial Palace Bubble"
    deck: "traps"
    module_level: 1
    type: "Cautionary Trap — Single-Lens Pitch-Pole (Lenses 1 & 2 Without Lens 3)"
    lens: ["Lens 2", "Lens 3"]
    gate_or_phase: "Round 2 Pitch-Pole Demo"
    cost_or_requirement: "Play Deming's Industrial Miracle without B:05 (Use-It-Or-Lose-It) or B:06 (2050 50/50 Stabilizer)."
    synergy_links: ["B:05", "B:06", "H:05"]
    effects:
      - label: "Hirano–Toda Land Bubble"
        rule: "You built a world-beating industrial and schooling engine, but left Lens 3 unguarded. All corporate surpluses pour into finite urban land until 1.15 sq km of Tokyo costs more than the State of California. Take 30 Turns of Balance-Sheet Stagnation."
    flavor_text: "New Zealand managed to catch the Tokyo property disease without first building the Tokyo industrial engine."
    empirical_anchor: "Deming (1950 Mt. Hakone Lecture); Hirano & Toda (2025 Land Overvaluation Theorem); Document 1A Part VI Coda."

  - id: "T:03"
    name: "The Seoul Hagwon Squeeze"
    deck: "traps"
    module_level: 1
    type: "Cautionary Trap — Primate-City Housing & Child-Cost Crush"
    lens: ["Lens 1", "Lens 2"]
    gate_or_phase: "Round 2 Pitch-Pole Demo"
    cost_or_requirement: "Max out Schooling while leaving Primate-City Land Speculation and private tutoring costs unchecked."
    synergy_links: ["B:01", "B:05", "C:05"]
    effects:
      - label: "Demographic Collapse"
        rule: "Young couples are crushed between 3.10x primate-city housing costs and a private tutoring arms race (Hagwon). Your Total Fertility Rate collapses to 0.72 and old-age pension solvency implodes."
    flavor_text: "When raising a child becomes a stressed luxury good in an overvalued primate city, the future simply stops being born."
    empirical_anchor: "21st-Century South Korea TFR benchmark (0.72-0.75); Document 1A Part VI Section 2."

  - id: "T:04"
    name: "The Lavoisier Syndrome (Rent-Seekers vs. Builders)"
    deck: "traps"
    module_level: 1
    type: "Cautionary Trap — Talent Misallocation (Lens 2 & Lens 3)"
    lens: ["Lens 2", "Lens 3"]
    gate_or_phase: "SS0 Status Quo / Round 2 Demo"
    cost_or_requirement: "Triggered when a NZD 1.6T Untaxed Property Pool coexists with under-capitalized firms (High Rent-Seeking Tax T)."
    synergy_links: ["B:03", "B:05", "K:02", "N:01", "H:03"]
    co2e_impact:
      display: "Stalls Clean-Tech R&D"
      status: "hazard_increase"
    effects:
      - label: "The Superstar Drain into Rent-Seeking"
        rule: "In a country with large existing land wealth and slow wage growth, fighting over existing dirt and tax loopholes pays higher private returns than building new technology. Divert your top-ability graduates (A > A*) out of Engineering & Enterprise (z_h) into Property Speculation, Conveyancing, and Lobbying (z_l)."
      - label: "Growth & Wage Penalty"
        rule: "Per Murphy, Shleifer, & Vishny (1991), doubling your rent-seeking share permanently cuts real per-capita GDP growth by -0.3% to -0.78%/yr and starves domestic firms of scale. To break this trap, play B:05 (Use-It-Or-Lose-It) + B:03 (Youth Capital Grant) to shift the talent cutoff back to builders (+0.5% to +1.25%/yr growth boost)."
    flavor_text: "In 1780s France, the great chemist Lavoisier made his fortune as a tax collector because rent-seeking paid better than science. In 2020s New Zealand, we turned our brightest young minds into mortgage brokers and wondered why productivity died."
    empirical_anchor: "Murphy, Shleifer, & Vishny (1991, QJE: Tables III–VI & Section III); Baumol (1990); Document 1A Part II Lens 2."

  - id: "T:05"
    name: "Disinformation & Outrage Drag (The Polarisation Tax)"
    deck: "traps"
    module_level: 1
    type: "Cautionary Trap — Epistemic & Social Cohesion Erosion (All Lenses)"
    lens: ["Lens 1", "Lens 2", "Lens 3"]
    gate_or_phase: "SS0 Status Quo / Continuous Hazard"
    cost_or_requirement: "Triggered when Gate 1–2 Stunting & Housing Despair meet Unfiltered Algorithmic Outrage."
    synergy_links: ["B:01", "B:02", "C:02", "C:06", "K:07"]
    co2e_impact:
      display: "Paralyzes Climate Action"
      status: "hazard_increase"
    effects:
      - label: "Preying on Disengagement & Stunting"
        rule: "Disinformation preys on early executive-function deficits (Gate 1) and economic alienation (Gate 3). While active in SS0, institutional trust drops to 40%, amplifying Exit 4 (Anti-Social & Justice Burden) by +25% and imposing a 0.5% GDP (~NZD 2.0B/yr) transaction-cost drag across public health and climate infrastructure."
      - label: "The Finnish Inoculation Counter-Play (Monilukutaito)"
        rule: "Following Finland (#1 in European Media Literacy Index 2017–2026), couple B:01 (First 2000 Days Executive Function) + B:02 (Ages 12–14 Mentoring) + C:02 (Cognitive Flexibility) to teach critical thinking and psychological inoculation from early childhood. Neutralizes T:05, lifts Social Cohesion from 100.0 to 126.0, and locks in C:06 (#1 Global Trust Rating)."
    flavor_text: "Finland shares a 1,340 km border with the world's largest disinformation factory, yet leads the world in societal trust—because they vaccinated their children's minds in primary school instead of policing the wreckage at Parliament."
    empirical_anchor: "OSI Media Literacy Index (2017–2026: Finland #1); Koi Tū Centre for Informed Futures (Gluckman & Sridhar, 2023–2026); UNESCO/Sopra Steria Global Disinformation Cost Audit; Zak & Knack (2001)."
    
  # ----------------------------------------------------------------------------
  # MODULE 2: CLIMATE & RESILIENCE EXPANSION — RISING SEAS & SHIFTING WINDS (C:01 - C:06)
  # ----------------------------------------------------------------------------
  - id: "C:01"
    name: "The Bilal–Känzig Shock (USD 1,200/tCO2e Reality Check)"
    deck: "climate"
    module_level: 2
    type: "Global Environment — World Enchantment"
    lens: ["Lens 1", "Lens 2", "Lens 3"]
    gate_or_phase: "Every Turn (Accelerating Change Clock)"
    cost_or_requirement: "Triggered automatically by Business-As-Usual turns"
    synergy_links: ["B:06", "B:07", "C:02", "C:04"]
    effects:
      - label: "Order of Magnitude"
        rule: "Reveal the true macroeconomic damage function: +1°C of Global Warming reduces World GDP by >20% and inflicts a >30% Present Welfare Loss. Set the true Social Cost of Carbon to USD 1,200+ per ton of CO2e."
      - label: "Asymmetric Impact"
        rule: "Conventional Thinkers relying on 'Country-Level Temperature' models or deferred maintenance take 3x Unbuffered Extreme Event Damage. IGWelfare Players gain Double Value on B:07 (ACC Forward Accounting) and C:04 (Coastal & Grid Armor)."
    flavor_text: "Economists spent decades looking at local weather and guessing climate change would cost a percent or two. Then they looked at global extreme events—and realized the board itself was on fire."
    empirical_anchor: "Bilal & Känzig (2024) NBER Working Paper on the Macroeconomic Impact of Climate Change."

  - id: "C:02"
    name: "Cognitive Flexibility (The Ultimate Resilient Asset)"
    deck: "climate"
    module_level: 2
    type: "Continuous Aura — Human Capability Shield"
    lens: ["Lens 1", "Lens 2"]
