new_zealand_empirical_anchors:
  - id: "DUNEDIN_STUDY"
    citation: "Poulton, R., Moffitt, T. E., & Silva, P. A. (2015 / 2023). The Dunedin Multidisciplinary Health and Development Study."
    institution: "University of Otago"
    key_finding: "The most disadvantaged 22% of a birth cohort—identifiable as early as age 3—accounts for 57% to 81% of adult hospital nights, long-term welfare receipt, and criminal convictions."
    cards_anchored: ["B:00", "B:01", "B:08", "H:01"]

  - id: "GUINZ_2020_2023"
    citation: "Morton, S. M. B., et al. (2020 / 2023). Growing Up in New Zealand: Now We Are Eight / Now We Are Twelve — Life in Early Adolescence."
    institution: "University of Auckland & Ministry of Social Development"
    key_finding: "Documents the 14.3% material hardship baseline, metropolitan housing crowding/dampness penalties, and the Ages 12–14 emerging autonomy and adolescent vulnerability gate."
    cards_anchored: ["B:01", "B:02", "C:03", "H:02"]

  - id: "BARNARDOS_2026"
    citation: "Danalytics Consulting Ltd (Sept 2026). The Economic Case for a Generational Plan for Children (Te Korowai Mokopuna)."
    institution: "Barnardos Aotearoa"
    key_finding: "Poor childhood outcomes cost NZD 17.7B/yr today (~NZD 105,000/yr per hardship child), rising to NZD 28.5B/yr by 2050 (NZD 434B PV at 2% real). Cutting hardship from 14.3% to 1-2% avoids NZD 56B–81B by 2050; Oranga Tamariki care costs ~NZD 180,000 per care-year."
    cards_anchored: ["B:00", "B:01", "B:04", "B:07", "K:01", "N:01"]

  - id: "GRAEME_DINGLE_2025"
    citation: "Graeme Dingle Foundation (2024–2025). Research & Evaluation Summary: Kiwi Can, Stars / Te Kāhui Whetū, Project K, & Career Navigator."
    institution: "Graeme Dingle Foundation & University of Auckland"
    key_finding: "Structured peer mentoring (Stars Year 12/13 tuakana mentoring Year 9 teina) and wilderness/community self-efficacy (Project K) build resilience, executive function, and school retention."
    cards_anchored: ["B:02", "C:03", "K:01", "N:04", "H:02"]

  - id: "TREASURY_CBAX_2025"
    citation: "New Zealand Treasury (Nov 2025). CBAx Tool User Guidance & Treasury Circular 2024/15 (2.0% Real Social Discount Rate & 8.0% Sensitivity Rate); He Tirohanga Mokopuna 2025; OIA 20250878."
    institution: "The Treasury / Kaitohutohu Kaupapa Rawa"
    key_finding: "Establishes the 2.0% real social rate of time preference (SRTP), projects 200% of GDP net Crown debt by 2065 under the status quo, and confirms (OIA 20250878) that the legacy LTFM contains no micro-cohort data."
    cards_anchored: ["B:00", "B:06", "B:07", "B:08", "K:03", "N:03", "H:01"]

  - id: "STATS_NZ_IRD_WEALTH"
    citation: "Statistics New Zealand (2024) Household Net Worth Survey; Inland Revenue (April 2023) High-Wealth Individuals Research Project Report; Rashbrooke, M. (2021/2024)."
    institution: "Stats NZ & Inland Revenue (Te Tari Taake)"
    key_finding: "Median NZ household net worth is NZD 529k; mean is NZD 1.041M; Top 5% threshold is ~NZD 3M; Top 1% is ~NZD 10M; IRD High-Wealth project median is NZD 50M+."
    cards_anchored: ["B:00", "B:05", "K:02"]

  - id: "REWIRING_AOTEAROA_2024"
    citation: "Griffith, S., Ellison, J., Pawson, M., & Conway, P. (Aug 2024). Investing in Tomorrow: The Electrification Opportunity."
    institution: "Rewiring Aotearoa"
    key_finding: "NZ spends ~NZD 20B/yr on fossil fuels; household electrification saves NZD 10.7B/yr by 2040 and cuts 10 MtCO2e/yr (105 MtCO2e cumulative 2024–2040) by swapping fuels for finance."
    cards_anchored: ["E:01", "E:02", "E:03"]

