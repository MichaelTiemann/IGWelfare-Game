card_overrides:
  B:00:
    name: Te Tatau o Rangiātea (The Rawlsian D20 of Whakapapa)
    type: Rule Zero Taonga — The 20 Whānau Balance Sheets of Aotearoa
    effects:
    - label: Who Goes First (The Pōtiki / Mokopuna Rule)
      rule: Every player rolls the d20 (1 to 20). The lowest roll (1–4, the 22% Hardship Corner in Te Pō) or the
        youngest player (pōtiki) leads first—because in tikanga Māori and Rawlsian justice alike, the health of
        the whole waka is decided by how we protect the youngest child.
    - label: Status Quo Roll (SS0 — Trapped in Te Pō)
      rule: 'Roll 1–4: Whānau trapped in the 22% hardship corner. Roll 5–18: Crushed by 3.10x urban rents and rangatahi
        exiled across the Tasman. Roll 19–20: Surrounded by 200% Crown debt and broken whakapapa. Result: No matter
        what you roll, the waka founders.'
    - label: Te Waka Hourua Roll (SS1 -> SS2 — Sailing into Te Ao Mārama)
      rule: 'Roll 1–20: All 20 whānau wealth groups thrive (+24.70% national wellbeing gain, Kaumātua Super lowered
        to Age 64 in SS2, PAYE cut to 18.25%). Roll any number; the waka sails true.'
    - label: 'Confirming the Fumble (Nat 1 Sub-Roll: 01:01 to 01:20)'
      rule: In SS0, all 20 sub-slices of the Bottom 5% face 52%–92% hardship risk in Te Pō and cost NZD 44k–180k/yr
        in reactive care/prisons. In SS2, all 20 faces are rescued (+23.5% to +38.4% CE gain, state care cut 94%,
        and NZD 62k+ Youth Capital Grant at age 20).
    - label: 'Confirming the Crit (Nat 20 Sub-Roll: 20:01 to 20:20)'
      rule: Inside the Top 5% (NZD 500k income + 3M NW up to 10M + 250M), faces 20:01–20:13 win on a blended average,
        and 19 out of 20 faces (20:01–20:19, up to NZD 100M NW) win outright for Active Kaitiaki Entrepreneurs (z_h).
        Even 20:20 retains 89.4%–94.5% of net worth.
  B:01:
    name: He Kākano i Ruia mai i Rangiātea (Tamariki of the First 2000 Days)
    type: 'Whakapapa Identity — Gate 1: Being (Ages 0–5)'
    effects:
    - label: Trapped in Te Pō (The Hardship Corner)
      rule: 'No child is born broken; every tamaiti is a sacred seed from Rangiātea. But if a whānau is left in
        unbuffered poverty and damp housing, roll a d20: on 1–4 (22%), attach a Struggling Trajectory token (driving
        57%–81% of late-game Hospital, State Care, and Justice trauma).'
    - label: Te Ao Mārama (Wrapped in Te Korowai Mokopuna & Whānau Ora)
      rule: Wrap the whānau in universal aroha and in-kind support. Remove all Struggling tokens, gain +2 Mauri
        & Capability on every subsequent kura/schooling card, and Crowd In +NZD 15.3k of Whānau Care & Time for
        free.
    flavor_text: E kore au e ngaro, he kākano i ruia mai i Rangiātea — I shall never be lost, for I am a seed sown
      from Rangiātea.
  B:03:
    name: 'Te Aka Matua: Tuakana–Teina & Ako Navigator'
    type: 'Rangatahi Becoming — Gate 2: Ascending the Sacred Vine (Ages 12–14)'
    flavor_text: Tāne-nui-a-Rangi climbed the sacred vine not for himself, but to bring the Three Baskets of Knowledge
      back down for all his siblings.
  B:06:
    name: 'Tūrangawaewae: Kaikōrero, Ringa Raupā, & Enterprise Builder'
    type: 'Evolved Rangatiratanga — Gate 4: Standing Tall at Home (Ages 20–35)'
    flavor_text: Ka pū te ruha, ka hao te rangatahi — As the old net is laid aside with honor, the new net goes
      fishing in home waters.
  B:08:
    name: Kaitiakitanga o te Whenua (Stewarding Land & Enterprise)
    type: Continuous Tikanga — Lens 3 Rebalance (Ka Hao te Rangatahi)
    flavor_text: Whenua is meant to nourish the living and the yet-to-be-born—not sit locked in speculative vaults
      while our grandchildren leave for Australia.
  B:09:
    name: Te Whakapapa Ledger (ACC Actuarial Time-Bend)
    type: Instant — Tohunga Whakatere Waka Star-Reading
  B:11:
    name: Te Waka Hourua (The Double-Hulled Voyaging Waka)
    type: Legendary Taonga — Lashed Dual-Hull Architecture (Kīato)
    effects:
    - label: Lashing the Kīato (Cross-Beams)
      rule: Conventional orthodoxy sails a single, waterlogged hull in Te Pō. When you lash together Te Ihu (Sacred
        Bow of Dual-Gate Whānau Capability, B:01 + B:03), Te Rā (Voyaging Sail of Kaitiaki Enterprise & Tūrangawaewae,
        B:06 + B:08), and Te Urunga (Steering Paddle of 2050 Stewardship, B:09 + B:14/B:15), your Waka Hourua rises
        onto the ocean swell.
    - label: Effect
      rule: Slash reactive social trauma and Crown remediation drag (Exits 1, 2, 4) by 75% (from NZD 17.7B–28.5B/yr
        down to NZD 4.2B/yr). Every birth cohort now generates a +NZD 28.1k–31.3k/yr Net Surplus for their mokopuna.
    flavor_text: One hull is Pākehā systems science; the other hull is Tikanga and Whakapapa. Lash them together
      with strong kīato, and no ocean on earth is too wide to cross.
  B:15:
    name: Ngā Kete o te Wānanga (The 2050 50/50 Kaitiaki Protocol)
    type: Legendary Engine — Phase 2 Harvest for Mokopuna
    flavor_text: Half the harvest pays down the debts of the past; half builds the whare and the grid for our mokopuna—while
      honoring every kaumātua and kuia at Age 64.
  B:16:
    name: He Tāngata, He Tāngata, He Tāngata (Lifting the Mauri of the Nation)
    type: Mythic Tikanga Victory — Restoration of Mana Motuhake & Mauri Ora
    flavor_text: 'Ui mai koe ki ahau he aha te mea nui o te ao, Māku e kī atu he tāngata, he tāngata, he tāngata
      — Ask me what is the greatest thing in the world; I will reply: it is people, it is people, it is people.'
  # --- Suite 2 (T:00–T:10) Waka Hourua Pou Overrides ---
  T:00:
    name: 'Te Waka Kāwana Mataku: The Molesworth Street Cycle-Lane Paralysis'
    type: Orthodoxy Hazard — Pou I (Kōrero & Leadership Myopia)
  T:01:
    name: 'Te Hau Kōrero Teka: The Ill Wind of Deceit & Division'
    type: Cautionary Trap — Pou I (Eroding Mauri, Kotahitanga, & Tikanga Pono)
    flavor_text: When a waka leaves its young cold and hungry in the bilge, false navigators whisper in the dark
      that the other hull is the enemy—until the lashings are cut from within. Teach the tamariki to read the true
      stars early, and no lie can turn the crew against itself.
  T:02:
    name: Te Moka Whakawai — The Trickle-Down Mirage & Coerced Hoe
    type: Cautionary Trap — Pou III (Regressive Extraction & Whānau Exhaustion)
    flavor_text: They promised the feast on the upper deck would trickle down to the bilge, while chaining the paddlers
      to double shifts with an empty gourd.
  T:03:
    name: 'Te Kaute Whāiti: The ''Solve Debt First'' Spreadsheet Boomerang'
    type: Cautionary Trap — Pou III (Cutting the Paddlers to Lighten the Hull)
  T:04:
    name: 'Te Rere Ohorere: The Day-1 Single-Shot Reef Gamble'
    type: Coopetitive Temptation — Pou I (Queue-Jump vs. Fleet Congestion)
  T:05:
    name: 'Te Tara-ā-Whare: Fighting Over the Catch Instead of Fishing'
    type: Cautionary Trap — Pou II (Misallocating Rangatahi Pūmanawa)
    flavor_text: When fighting over old land titles pays ten times more than weaving a new net or building a new
      waka, the sharpest minds stop fishing—and the whole village goes hungry.
  T:06:
    name: 'Te Kete Pakaru: Regional Tax Leakage & Offshore Caterer Siphon'
    type: Spatial & Procurement Trap — Pou IV (Bleeding Mauri Off the Board)
  T:07:
    name: 'Te Tai Hoki-Rua: The Two-Term ''Stop-Go'' Political Pendulum'
    type: Political Stability Hazard — Pou I (Six-Year Scissor-Blade)
  T:08:
    name: 'Te Tuanui Tāke-Kore: Compassion Without Whenua Sovereignty'
    type: Cautionary Trap — Pou II (Single-Hull Capsize at 96.0)
  T:09:
    name: 'Te Kūiti Whānau: The Primate-City Demographic Collapse'
    type: Cautionary Trap — Pou III (Uncooled Rents & Empty Cradles)
  T:10:
    name: 'Te Mirumiru Whenua 1989: The Unstabilized Surplus Bubble'
    type: End-Game Cautionary Trap — Pou II (Whenua Speculation Overwhelms the Harvest)
